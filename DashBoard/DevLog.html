<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dev Log</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&family=Black+Han+Sans&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:#0d0d0e; --s1:#141415; --s2:#1a1a1c; --b1:#232326; --b2:#2e2e32; --b3:#3a3a3f;
  --tx:#e5e5e9; --tx2:#7c7c88; --tx3:#404048; --green:#6effa0; --red:#ff6060; --teal:#4ecdc4;
  --font:'DM Mono',monospace;
}
html,body{background:var(--bg);color:var(--tx);font-family:var(--font);font-size:13px;margin:0;padding:0;overflow:hidden;}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-thumb{background:var(--b2);border-radius:2px}
.w{background:var(--s1);border:1px solid var(--b2);border-radius:0;padding:20px 22px;display:flex;flex-direction:column;}
.wlabel{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--tx3);display:flex;align-items:center;gap:6px;margin-bottom:14px;font-family:'Black Han Sans',sans-serif;flex-shrink:0;}
.wdot{width:4px;height:4px;border-radius:50%;background:var(--teal);flex-shrink:0;}
.log-list{display:flex;flex-direction:column;gap:5px;height:320px;min-height:320px;overflow-y:auto;flex-shrink:0;}
.li{display:flex;align-items:flex-start;gap:8px;padding:8px 10px;background:var(--s2);border:1px solid var(--b1);border-radius:7px;transition:border-color .12s;flex-shrink:0;}
.li:hover{border-color:var(--b2);}
.li:hover .xbtn{opacity:1;}
.li-time{font-size:10px;color:var(--teal);white-space:nowrap;flex-shrink:0;margin-top:1px;}
.li-txt{font-size:11px;color:var(--tx);flex:1;line-height:1.5;word-break:break-all;}
.li-ghost{opacity:0;pointer-events:none;height:34px;flex-shrink:0;}
.xbtn{font-size:10px;color:var(--tx3);background:none;border:none;cursor:pointer;opacity:0;transition:opacity .12s,color .12s;font-family:var(--font);padding:0 2px;flex-shrink:0;}
.xbtn:hover{color:var(--red);}
.empty{font-size:11px;color:var(--tx3);padding:12px 0;text-align:center;}
.add-row{display:flex;gap:6px;margin-top:10px;flex-shrink:0;}
.ainput{flex:1;background:var(--s2);border:1px solid var(--b1);border-radius:7px;padding:8px 11px;font-size:11px;color:var(--tx);font-family:var(--font);outline:none;transition:border-color .15s;}
.ainput:focus{border-color:var(--b3);}
.ainput::placeholder{color:var(--tx3);}
.abtn{background:var(--s2);border:1px solid var(--b2);border-radius:7px;padding:8px 14px;font-size:11px;color:var(--teal);font-family:var(--font);cursor:pointer;transition:all .15s;white-space:nowrap;flex-shrink:0;}
.abtn:hover{background:var(--b1);}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--b2);color:var(--tx);font-size:11px;padding:8px 16px;border-radius:8px;pointer-events:none;opacity:0;transition:opacity .2s;white-space:nowrap;z-index:99;}
.toast.show{opacity:1;}
</style>
</head>
<body>
<div class="w">
  <div class="wlabel"><span class="wdot"></span>Dev Log</div>
  <div class="log-list" id="log-list"></div>
  <div class="add-row">
    <input class="ainput" id="log-inp" placeholder="+ 지금 뭐 했는지 한 줄...">
    <button class="abtn" onclick="addLog()">기록</button>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
var DASHBOARD_SECRET = new URLSearchParams(location.search).get('s') || '';
var PROXY = 'https://notion-phi-six.vercel.app/api/notion';
var DB_ID = '68ea8b611ad441aba16fe926b53fdcb5';
var MIN_SLOTS = 6;
var logs = [];

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function showToast(msg) {
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(function(){ el.classList.remove('show'); }, 2000);
}

function pad(x) { return String(x).padStart(2,'0'); }

function renderLog() {
  var el = document.getElementById('log-list');
  el.innerHTML = '';
  var reversed = logs.slice().reverse();
  reversed.forEach(function(l) {
    var d = document.createElement('div');
    d.className = 'li';
    d.innerHTML = '<span class="li-time">' + esc(l.time) + '</span><span class="li-txt">' + esc(l.txt) + '</span><button class="xbtn" onclick="delLog(\'' + esc(l.pageId) + '\', event)">✕</button>';
    el.appendChild(d);
  });
  var ghostCount = MIN_SLOTS - logs.length;
  for (var i = 0; i < ghostCount; i++) {
    var g = document.createElement('div');
    g.className = 'li li-ghost';
    el.appendChild(g);
  }
}

function localDate(d) {
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function loadFromNotion() {
  var dateStr = localDate(new Date());
  fetch(PROXY + '?path=databases/' + DB_ID + '/query', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'x-dashboard-secret': DASHBOARD_SECRET },
    body: JSON.stringify({
      filter: { property: 'Date', date: { on_or_after: dateStr } },
      sorts: [{ timestamp: 'created_time', direction: 'ascending' }]
    })
  })
  .then(function(r){ if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(function(data) {
    logs = data.results.map(function(p) {
      return {
        pageId: p.id,
        time: (p.properties.Time && p.properties.Time.rich_text[0] && p.properties.Time.rich_text[0].plain_text) || '',
        txt: (p.properties.Content && p.properties.Content.title[0] && p.properties.Content.title[0].plain_text) || ''
      };
    });
    renderLog();
  })
  .catch(function(){ showToast('로드 실패'); });
}

function addLog() {
  var v = document.getElementById('log-inp').value.trim();
  if (!v) return;
  var n = new Date();
  var time = pad(n.getHours()) + ':' + pad(n.getMinutes());
  var dateStr = localDate(n);
  fetch(PROXY + '?path=pages', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'x-dashboard-secret': DASHBOARD_SECRET },
    body: JSON.stringify({
      parent: { database_id: DB_ID },
      properties: {
        Content: { title: [{ text: { content: v } }] },
        Time: { rich_text: [{ text: { content: time } }] },
        Date: { date: { start: dateStr } },
        Tag: { multi_select: [] }
      }
    })
  })
  .then(function(r){ if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(function(page) {
    document.getElementById('log-inp').value = '';
    logs.push({ pageId: page.id, time: time, txt: v });
    renderLog();
  })
  .catch(function(){ showToast('추가 실패'); });
}

function delLog(pageId, e) {
  e.stopPropagation();
  fetch(PROXY + '?path=pages/' + pageId, {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json', 'x-dashboard-secret': DASHBOARD_SECRET },
    body: JSON.stringify({ archived: true })
  })
  .then(function() {
    logs = logs.filter(function(l){ return l.pageId !== pageId; });
    renderLog();
  })
  .catch(function(){ showToast('삭제 실패'); });
}

document.getElementById('log-inp').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') addLog();
});

loadFromNotion();
</script>
</body>
</html>
