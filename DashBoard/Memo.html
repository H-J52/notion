<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memo</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&family=Black+Han+Sans&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:#0d0d0e; --s1:#141415; --s2:#1a1a1c; --b1:#232326; --b2:#2e2e32; --b3:#3a3a3f;
  --tx:#e5e5e9; --tx2:#7c7c88; --tx3:#404048; --green:#6effa0; --red:#ff6060;
  --font:'DM Mono',monospace;
}
html,body{background:var(--bg);color:var(--tx);font-family:var(--font);font-size:13px;margin:0;padding:0;overflow:hidden;}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-thumb{background:var(--b2);border-radius:2px}
.w{background:var(--s1);border:1px solid var(--b2);border-radius:0;padding:20px 22px;display:flex;flex-direction:column;}
.wlabel{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--tx3);display:flex;align-items:center;gap:6px;margin-bottom:14px;font-family:'Black Han Sans',sans-serif;flex-shrink:0;}
.wdot{width:4px;height:4px;border-radius:50%;background:var(--tx3);flex-shrink:0;}
.memo-list{display:flex;flex-direction:column;gap:6px;height:240px;min-height:240px;overflow-y:auto;flex-shrink:0;}
.mi{background:var(--s2);border:1px solid var(--b1);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;flex-shrink:0;transition:border-color .12s;}
.mi:hover{border-color:var(--b2);}
.mi:hover .xbtn{opacity:1;}
.mi-head{display:flex;align-items:center;justify-content:space-between;}
.mi-title{font-size:12px;color:var(--tx);flex:1;}
.xbtn{font-size:10px;color:var(--tx3);background:none;border:none;cursor:pointer;opacity:0;transition:opacity .12s,color .12s;font-family:var(--font);padding:0 2px;}
.xbtn:hover{color:var(--red);}
.mi-content{font-size:11px;color:var(--tx2);line-height:1.5;white-space:pre-wrap;word-break:break-all;}
.empty{font-size:11px;color:var(--tx3);padding:12px 0;text-align:center;}
.add-area{display:flex;flex-direction:column;gap:6px;margin-top:10px;flex-shrink:0;}
.ainput{flex:1;background:var(--s2);border:1px solid var(--b1);border-radius:7px;padding:8px 11px;font-size:11px;color:var(--tx);font-family:var(--font);outline:none;transition:border-color .15s;}
.ainput:focus{border-color:var(--b3);}
.ainput::placeholder{color:var(--tx3);}
textarea.ainput{resize:none;height:60px;line-height:1.5;}
.abtn{background:var(--s2);border:1px solid var(--b2);border-radius:7px;padding:8px 14px;font-size:11px;color:var(--green);font-family:var(--font);cursor:pointer;transition:all .15s;white-space:nowrap;}
.abtn:hover{background:var(--b1);}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--b2);color:var(--tx);font-size:11px;padding:8px 16px;border-radius:8px;pointer-events:none;opacity:0;transition:opacity .2s;white-space:nowrap;z-index:99;}
.toast.show{opacity:1;}
</style>
</head>
<body>
<div class="w">
  <div class="wlabel"><span class="wdot"></span>Memo</div>
  <div class="memo-list" id="memo-list"></div>
  <div class="add-area">
    <input class="ainput" id="m-title" placeholder="제목">
    <textarea class="ainput" id="m-content" placeholder="내용..."></textarea>
    <button class="abtn" onclick="addMemo()">추가</button>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
var DASHBOARD_SECRET = localStorage.getItem('dvf_secret') || '';
var PROXY = 'https://notion-phi-six.vercel.app/api/notion';
var DB_ID = '838d3be1db5840ebaf4ae2cf9b0e91fd';
var memos = [];

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function showToast(msg) {
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(function(){ el.classList.remove('show'); }, 2000);
}

function renderM() {
  var el = document.getElementById('memo-list');
  el.innerHTML = '';
  if (!memos.length) { el.innerHTML = '<div class="empty">메모 없음</div>'; return; }
  memos.forEach(function(m) {
    var d = document.createElement('div');
    d.className = 'mi';
    d.innerHTML = '<div class="mi-head"><span class="mi-title">' + esc(m.title) + '</span><button class="xbtn" onclick="delMemo(\'' + esc(m.pageId) + '\', event)">✕</button></div>' +
      (m.content ? '<div class="mi-content">' + esc(m.content) + '</div>' : '');
    el.appendChild(d);
  });
}

function loadFromNotion() {
  fetch(PROXY + '?path=databases/' + DB_ID + '/query', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'x-dashboard-secret': DASHBOARD_SECRET },
    body: JSON.stringify({
      filter: { property: 'Type', select: { equals: 'Memo' } },
      sorts: [{ timestamp: 'created_time', direction: 'descending' }]
    })
  })
  .then(function(r){ return r.json(); })
  .then(function(data) {
    memos = data.results.map(function(p) {
      return {
        pageId: p.id,
        title: (p.properties.Title.title[0] && p.properties.Title.title[0].plain_text) || '',
        content: (p.properties.Content && p.properties.Content.rich_text[0] && p.properties.Content.rich_text[0].plain_text) || ''
      };
    });
    renderM();
  })
  .catch(function(){ showToast('로드 실패'); });
}

function addMemo() {
  var title = document.getElementById('m-title').value.trim();
  var content = document.getElementById('m-content').value.trim();
  if (!title) return;
  fetch(PROXY + '?path=pages', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'x-dashboard-secret': DASHBOARD_SECRET },
    body: JSON.stringify({
      parent: { database_id: DB_ID },
      properties: {
        Title: { title: [{ text: { content: title } }] },
        Content: { rich_text: [{ text: { content: content } }] },
        Type: { select: { name: 'Memo' } },
        Tag: { multi_select: [] }
      }
    })
  })
  .then(function(r){ return r.json(); })
  .then(function(page) {
    document.getElementById('m-title').value = '';
    document.getElementById('m-content').value = '';
    memos.unshift({ pageId: page.id, title: title, content: content });
    renderM();
  })
  .catch(function(){ showToast('추가 실패'); });
}

function delMemo(pageId, e) {
  e.stopPropagation();
  fetch(PROXY + '?path=pages/' + pageId, {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json', 'x-dashboard-secret': DASHBOARD_SECRET },
    body: JSON.stringify({ archived: true })
  })
  .then(function() {
    memos = memos.filter(function(m){ return m.pageId !== pageId; });
    renderM();
  })
  .catch(function(){ showToast('삭제 실패'); });
}

loadFromNotion();
</script>
</body>
</html>
