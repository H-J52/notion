<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weekly Wins</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&family=Black+Han+Sans&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:    #0d0d0e;
  --s1:    #141415;
  --s2:    #1a1a1c;
  --b1:    #232326;
  --b2:    #2e2e32;
  --b3:    #3a3a3f;
  --tx:    #e5e5e9;
  --tx2:   #7c7c88;
  --tx3:   #404048;
  --green: #6effa0;
  --red:   #ff6060;
  --yel:   #ffd166;
  --font:  'DM Mono', monospace;
}
html, body {
  background: var(--bg);
  color: var(--tx);
  font-family: var(--font);
  font-size: 13px;
  margin: 0; padding: 0;
  overflow: hidden;
}
::-webkit-scrollbar { width: 3px; }
::-webkit-scrollbar-thumb { background: var(--b2); border-radius: 2px; }
.w {
  background: var(--s1);
  border: 1px solid var(--b2);
  border-radius: 0;
  padding: 20px 22px;
  display: flex;
  flex-direction: column;
}
.wlabel {
  font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--tx3); display: flex; align-items: center; gap: 6px;
  margin-bottom: 14px; font-family: 'Black Han Sans', sans-serif; flex-shrink: 0;
}
.wdot { width: 4px; height: 4px; border-radius: 50%; background: var(--yel); flex-shrink: 0; }
.wlabel-r { margin-left: auto; }
.wlbtn {
  font-size: 9px; color: var(--tx3); background: none; border: none;
  font-family: var(--font); cursor: pointer; letter-spacing: 0.08em;
  transition: color 0.15s; padding: 0;
}
.wlbtn:hover { color: var(--tx2); }
.w-list { display: flex; flex-direction: column; gap: 8px; height: 282px; min-height: 282px; overflow-y: auto; flex-shrink: 0; }
.wc {
  background: var(--s2); border: 1px solid var(--b1);
  border-radius: 8px; padding: 12px 14px; flex-shrink: 0;
}
.wc:hover .xbtn { opacity: 1 !important; }
.wc-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; gap: 8px; }
.wc-cat { font-size: 11px; color: var(--tx2); }
.wc-right { display: flex; align-items: center; gap: 7px; }
.wbtn {
  width: 22px; height: 22px; border: 1px solid var(--b2); background: transparent;
  border-radius: 5px; color: var(--tx2); font-size: 15px; line-height: 1;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  font-family: var(--font); transition: all 0.12s;
}
.wbtn:hover { border-color: var(--b3); color: var(--tx); }
.wc-num {
  font-size: 22px; font-weight: 300; color: var(--tx);
  background: transparent; border: none; font-family: var(--font);
  width: 44px; text-align: center; outline: none; cursor: text;
  -moz-appearance: textfield;
}
.wc-num::-webkit-outer-spin-button,
.wc-num::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
#w-max::-webkit-outer-spin-button,
#w-max::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.wc-num:focus { color: var(--green); border-bottom: 1px solid var(--b3); }
.wc-max { font-size: 10px; color: var(--tx3); white-space: nowrap; }
.xbtn {
  font-size: 10px; color: var(--tx3); background: none; border: none;
  cursor: pointer; opacity: 0; transition: opacity 0.12s, color 0.12s;
  font-family: var(--font); padding: 0 2px;
}
.xbtn:hover { color: var(--red); }
.wc-bar { height: 2px; background: var(--b1); border-radius: 1px; overflow: hidden; }
.wc-fill { height: 100%; border-radius: 1px; transition: width 0.3s ease; }
.wc-ghost { opacity: 0; pointer-events: none; height: 68px; flex-shrink: 0; }
.add-row { display: flex; gap: 6px; margin-top: 10px; flex-shrink: 0; }
.ainput {
  flex: 1; background: var(--s2); border: 1px solid var(--b1);
  border-radius: 7px; padding: 8px 11px;
  font-size: 11px; color: var(--tx); font-family: var(--font);
  outline: none; transition: border-color 0.15s;
}
.ainput:focus { border-color: var(--b3); }
.ainput::placeholder { color: var(--tx3); }
.abtn {
  background: var(--s2); border: 1px solid var(--b2);
  border-radius: 7px; padding: 8px 14px;
  font-size: 11px; color: var(--yel); font-family: var(--font);
  cursor: pointer; transition: all 0.15s; white-space: nowrap;
}
.abtn:hover { background: var(--b1); }
</style>
</head>
<body>
<div class="w">
  <div class="wlabel">
    <span class="wdot"></span>Weekly Wins
    <span class="wlabel-r">
      <button class="wlbtn" onclick="resetWins()">초기화</button>
    </span>
  </div>
  <div class="w-list" id="w-list"></div>
  <div class="add-row">
    <input class="ainput" id="w-cat" placeholder="+ 카테고리..." onkeydown="if(event.key==='Enter')addW()">
    <input class="ainput" id="w-max" value="10" type="number" style="flex:0 0 52px;text-align:center;-moz-appearance:textfield;" placeholder="목표" class="no-arrow">
    <button class="abtn" onclick="addW()">추가</button>
  </div>
</div>

<script>
const STORAGE_KEY  = 'devflow_wins';
const WEEK_KEY     = 'devflow_wins_week';
const MIN_SLOTS    = 3;
const WC = ['#6effa0','#ffd166','#ff6060','#6ea8ff','#b48aff','#4ecdc4'];

let wins = [];
let seed = 1;

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function getMondayStr() {
  const d = new Date();
  const day = d.getDay();
  const diff = d.getDate() - day + (day === 0 ? -6 : 1);
  const mon = new Date(new Date().setDate(diff));
  return `${mon.getFullYear()}-${mon.getMonth()+1}-${mon.getDate()}`;
}

function renderW() {
  const el = document.getElementById('w-list');
  el.innerHTML = '';
  wins.forEach(w => {
    const pct = Math.min(100, Math.round(w.n / w.max * 100));
    const d = document.createElement('div');
    d.className = 'wc';
    d.innerHTML = `
      <div class="wc-top">
        <span class="wc-cat">${esc(w.cat)}</span>
        <div class="wc-right">
          <button class="wbtn" onclick="setW(${w.id}, -1, true)">−</button>
          <input class="wc-num" id="wn${w.id}" value="${w.n}" type="number"
            onchange="setW(${w.id}, this.value)"
            onkeydown="if(event.key==='Enter')this.blur()">
          <button class="wbtn" onclick="setW(${w.id}, 1, true)">+</button>
          <span class="wc-max">/ ${w.max}</span>
          <button class="xbtn" onclick="delW(${w.id})">✕</button>
        </div>
      </div>
      <div class="wc-bar"><div class="wc-fill" id="wf${w.id}" style="width:${pct}%;background:${w.color}"></div></div>
    `;
    el.appendChild(d);
  });
  // 3개 미만 더미
  const ghostCount = MIN_SLOTS - wins.length;
  for (let i = 0; i < ghostCount; i++) {
    const g = document.createElement('div');
    g.className = 'wc wc-ghost';
    el.appendChild(g);
  }
  saveState();
}

function setW(id, v, isDelta = false) {
  const w = wins.find(x => x.id === id);
  if (!w) return;
  w.n = Math.max(0, isDelta ? w.n + (parseInt(v) || 0) : (parseInt(v) || 0));
  const el = document.getElementById('wn' + id);
  if (el) el.value = w.n;
  const f = document.getElementById('wf' + id);
  if (f) f.style.width = Math.min(100, Math.round(w.n / w.max * 100)) + '%';
  saveState();
}

function delW(id) {
  wins = wins.filter(w => w.id !== id);
  renderW();
}

function resetWins() {
  wins.forEach(w => w.n = 0);
  renderW();
}

function addW() {
  const c = document.getElementById('w-cat').value.trim();
  if (!c) return;
  const max = parseInt(document.getElementById('w-max').value) || 10;
  wins.push({ id: seed++, cat: c, n: 0, max, color: WC[wins.length % WC.length] });
  document.getElementById('w-cat').value = '';
  renderW();
}

function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify({ wins, seed }));
}

function loadState() {
  const raw = localStorage.getItem(STORAGE_KEY);
  if (raw) { try { const d = JSON.parse(raw); wins = d.wins || []; seed = d.seed || 1; } catch(e) {} }
}

function checkWeekReset() {
  const monday = getMondayStr();
  const last   = localStorage.getItem(WEEK_KEY);
  if (last && last !== monday) {
    wins.forEach(w => w.n = 0);
    saveState();
  }
  localStorage.setItem(WEEK_KEY, monday);
}

loadState();
checkWeekReset();
renderW();

setInterval(() => {
  const monday = getMondayStr();
  if (localStorage.getItem(WEEK_KEY) !== monday) { checkWeekReset(); renderW(); }
}, 60000);
</script>
</body>
</html>
