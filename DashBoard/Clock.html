<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clock</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&family=Black+Han+Sans&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:    #0d0d0e;
  --s1:    #141415;
  --b1:    #232326;
  --b2:    #2e2e32;
  --tx:    #e5e5e9;
  --tx3:   #404048;
  --green: #6effa0;
  --font:  'DM Mono', monospace;
}
html, body {
  background: var(--bg);
  color: var(--tx);
  font-family: var(--font);
  margin: 0;
  padding: 0;
  overflow: hidden;
}
.w-clock {
  background: var(--s1);
  border: 1px solid var(--b1);
  border-radius: 12px;
  padding: 20px 28px;
  display: flex;
  align-items: center;
  transition: border-color 0.2s;
}
.w-clock:hover { border-color: var(--b2); }
.clock-time {
  font-family: 'Black Han Sans', sans-serif;
  font-size: 52px;
  font-weight: 400;
  color: var(--tx);
  line-height: 1;
  letter-spacing: 0.06em;
}
.clock-colon { color: var(--green); }
.clock-date {
  font-size: 11px;
  color: var(--tx3);
  letter-spacing: 0.06em;
  margin-top: 6px;
}
</style>
</head>
<body>
<div class="w-clock">
  <div>
    <div class="clock-time" id="ctime">
      00<span class="clock-colon">:</span>00<span class="clock-colon">:</span>00
    </div>
    <div class="clock-date" id="cdate"></div>
  </div>
</div>

<script>
function tick() {
  const n = new Date();
  const p = v => String(v).padStart(2, '0');
  const D = ['일','월','화','수','목','금','토'];
  const M = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  document.getElementById('ctime').innerHTML =
    `${p(n.getHours())}<span class="clock-colon">:</span>${p(n.getMinutes())}<span class="clock-colon">:</span>${p(n.getSeconds())}`;
  document.getElementById('cdate').textContent =
    `${D[n.getDay()]}요일 · ${M[n.getMonth()]} ${n.getDate()}, ${n.getFullYear()}`;
}
tick();
setInterval(tick, 1000);
</script>
</body>
</html>
