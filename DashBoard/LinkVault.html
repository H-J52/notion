<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Link Vault</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&family=Black+Han+Sans&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:#0d0d0e; --s1:#141415; --s2:#1a1a1c; --b1:#232326; --b2:#2e2e32; --b3:#3a3a3f;
  --tx:#e5e5e9; --tx2:#7c7c88; --tx3:#404048; --green:#6effa0; --red:#ff6060; --blue:#6ea8ff;
  --font:'DM Mono',monospace;
}
html,body{background:var(--bg);color:var(--tx);font-family:var(--font);font-size:13px;margin:0;padding:0;overflow:hidden;}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-thumb{background:var(--b2);border-radius:2px}
.w{background:var(--s1);border:1px solid var(--b2);border-radius:0;padding:20px 22px;display:flex;flex-direction:column;}
.wlabel{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--tx3);display:flex;align-items:center;gap:6px;margin-bottom:10px;font-family:'Black Han Sans',sans-serif;flex-shrink:0;}
.wdot{width:4px;height:4px;border-radius:50%;background:var(--blue);flex-shrink:0;}
.search-row{display:flex;gap:6px;margin-bottom:10px;flex-shrink:0;}
.sinput{flex:1;background:var(--s2);border:1px solid var(--b1);border-radius:7px;padding:7px 11px;font-size:11px;color:var(--tx);font-family:var(--font);outline:none;transition:border-color .15s;}
.sinput:focus{border-color:var(--b3);}
.sinput::placeholder{color:var(--tx3);}
.fsel{background:var(--s2);border:1px solid var(--b1);border-radius:7px;padding:7px 8px;font-size:11px;color:var(--tx2);font-family:var(--font);outline:none;cursor:pointer;flex-shrink:0;}
.link-list{display:flex;flex-direction:column;gap:6px;height:240px;min-height:240px;overflow-y:auto;flex-shrink:0;}
.li{display:flex;align-items:center;gap:8px;padding:9px 12px;background:var(--s2);border:1px solid var(--b1);border-radius:8px;transition:border-color .12s;cursor:pointer;flex-shrink:0;}
.li:hover{border-color:var(--b2);}
.li:hover .xbtn{opacity:1;}
.li-icon{font-size:14px;flex-shrink:0;}
.li-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
.li-title{font-size:11px;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.li-url{font-size:9px;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.li-tag{font-size:9px;color:var(--tx3);background:var(--b1);border-radius:4px;padding:2px 6px;white-space:nowrap;flex-shrink:0;}
.xbtn{font-size:10px;color:var(--tx3);background:none;border:none;cursor:pointer;opacity:0;transition:opacity .12s,color .12s;font-family:var(--font);padding:0 2px;flex-shrink:0;}
.xbtn:hover{color:var(--red);}
.empty{font-size:11px;color:var(--tx3);padding:12px 0;text-align:center;}
.add-area{display:flex;flex-direction:column;gap:6px;margin-top:10px;flex-shrink:0;}
.ainput{flex:1;background:var(--s2);border:1px solid var(--b1);border-radius:7px;padding:8px 11px;font-size:11px;color:var(--tx);font-family:var(--font);outline:none;transition:border-color .15s;}
.ainput:focus{border-color:var(--b3);}
.ainput::placeholder{color:var(--tx3);}
.abtn{background:var(--s2);border:1px solid var(--b2);border-radius:7px;padding:8px 14px;font-size:11px;color:var(--blue);font-family:var(--font);cursor:pointer;transition:all .15s;white-space:nowrap;flex-shrink:0;}
.abtn:hover{background:var(--b1);}
.add-row{display:flex;gap:6px;}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--b2);color:var(--tx);font-size:11px;padding:8px 16px;border-radius:8px;pointer-events:none;opacity:0;transition:opacity .2s;white-space:nowrap;z-index:99;}
.toast.show{opacity:1;}
</style>
</head>
<body>
<div class="w">
  <div class="wlabel"><span class="wdot"></span>Link Vault</div>
  <div class="search-row">
    <input class="sinput" id="l-search" placeholder="🔍 검색...">
    <select class="fsel" id="l-filter"><option value="">전체</option></select>
  </div>
  <div class="link-list" id="link-list"></div>
  <div class="add-area">
    <input class="ainput" id="l-url" placeholder="URL">
    <div class="add-row">
      <input class="ainput" id="l-title" placeholder="제목">
      <button class="abtn" onclick="addLink()">추가</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
var DASHBOARD_SECRET = new URLSearchParams(location.search).get('s') || '';
var PROXY = 'https://notion-phi-six.vercel.app/api/notion';
var DB_ID = '838d3be1db5840ebaf4ae2cf9b0e91fd';
var links = [];

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function showToast(msg) {
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(function(){ el.classList.remove('show'); }, 2000);
}

function getDomain(url) {
  try { return new URL(url).hostname.replace('www.',''); } catch(e) { return url; }
}

function renderL() {
  var el = document.getElementById('link-list');
  var q = document.getElementById('l-search').value.toLowerCase();
  var f = document.getElementById('l-filter').value;
  el.innerHTML = '';
  var filtered = links.filter(function(l) {
    return (!q || l.title.toLowerCase().includes(q) || l.url.toLowerCase().includes(q)) &&
           (!f || l.tag === f);
  });
  if (!filtered.length) { el.innerHTML = '<div class="empty">링크 없음</div>'; return; }
  filtered.forEach(function(l) {
    var d = document.createElement('div');
    d.className = 'li';
    d.innerHTML = '<span class="li-icon">🔗</span><div class="li-info"><span class="li-title">' + esc(l.title || getDomain(l.url)) + '</span><span class="li-url">' + esc(getDomain(l.url)) + '</span></div>' +
      (l.tag ? '<span class="li-tag">' + esc(l.tag) + '</span>' : '') +
      '<button class="xbtn" onclick="delLink(\'' + esc(l.pageId) + '\', event)">✕</button>';
    d.addEventListener('click', function(e) {
      if (e.target.classList.contains('xbtn')) return;
      var href = l.url.startsWith('http') ? l.url : 'https://' + l.url; window.open(href, '_blank', 'noopener,noreferrer');
    });
    el.appendChild(d);
  });
}

function loadFromNotion() {
  fetch(PROXY + '?path=databases/' + DB_ID + '/query', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'x-dashboard-secret': DASHBOARD_SECRET },
    body: JSON.stringify({
      filter: { property: 'Type', select: { equals: 'Link' } },
      sorts: [{ timestamp: 'created_time', direction: 'descending' }]
    })
  })
  .then(function(r){ if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(function(data) {
    links = data.results.map(function(p) {
      return {
        pageId: p.id,
        title: (p.properties.Title.title[0] && p.properties.Title.title[0].plain_text) || '',
        url: (p.properties['URL'] && p.properties['URL'].url) || '',
        tag: (p.properties.Tag && p.properties.Tag.multi_select[0] && p.properties.Tag.multi_select[0].name) || ''
      };
    });
    // 태그 필터 업데이트
    var tags = [...new Set(links.map(function(l){ return l.tag; }).filter(Boolean))];
    var sel = document.getElementById('l-filter');
    sel.innerHTML = '<option value="">전체</option>' + tags.map(function(t){ return '<option value="' + esc(t) + '">' + esc(t) + '</option>'; }).join('');
    renderL();
  })
  .catch(function(){ showToast('로드 실패'); });
}

var adding = false;
function addLink() {
  if (adding) return;
  var url = document.getElementById('l-url').value.trim();
  var title = document.getElementById('l-title').value.trim();
  if (!url) return;
  adding = true;
  fetch(PROXY + '?path=pages', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'x-dashboard-secret': DASHBOARD_SECRET },
    body: JSON.stringify({
      parent: { database_id: DB_ID },
      properties: {
        Title: { title: [{ text: { content: title || url } }] },
        'URL': { url: url },
        Type: { select: { name: 'Link' } },
        Tag: { multi_select: [] }
      }
    })
  })
  .then(function(r){ if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(function(page) {
    document.getElementById('l-url').value = '';
    document.getElementById('l-title').value = '';
    links.unshift({ pageId: page.id, title: title || url, url: url, tag: '' });
    renderL();
  })
  .catch(function(){ showToast('추가 실패'); })
  .finally(function(){ adding = false; });
}

function delLink(pageId, e) {
  e.stopPropagation();
  fetch(PROXY + '?path=pages/' + pageId, {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json', 'x-dashboard-secret': DASHBOARD_SECRET },
    body: JSON.stringify({ archived: true })
  })
  .then(function() {
    links = links.filter(function(l){ return l.pageId !== pageId; });
    renderL();
  })
  .catch(function(){ showToast('삭제 실패'); });
}

document.getElementById('l-search').addEventListener('input', renderL);
document.getElementById('l-filter').addEventListener('change', renderL);
document.getElementById('l-url').addEventListener('keydown', function(e){ if(e.key==='Enter') addLink(); });

loadFromNotion();
</script>
</body>
</html>
