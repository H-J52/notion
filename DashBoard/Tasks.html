<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tasks</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&family=Black+Han+Sans&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:    #0d0d0e;
  --s1:    #141415;
  --s2:    #1a1a1c;
  --b1:    #232326;
  --b2:    #2e2e32;
  --b3:    #3a3a3f;
  --tx:    #e5e5e9;
  --tx2:   #7c7c88;
  --tx3:   #404048;
  --green: #6effa0;
  --red:   #ff6060;
  --yel:   #ffd166;
  --blue:  #6ea8ff;
  --font:  'DM Mono', monospace;
}
html, body {
  background: var(--bg);
  color: var(--tx);
  font-family: var(--font);
  font-size: 13px;
  margin: 0; padding: 0;
  overflow: hidden;
}
::-webkit-scrollbar { width: 3px; }
::-webkit-scrollbar-thumb { background: var(--b2); border-radius: 2px; }
.w {
  background: var(--s1);
  border: 1px solid var(--b2);
  border-radius: 0;
  padding: 20px 22px;
  display: flex;
  flex-direction: column;
}
.wlabel {
  font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--tx3); display: flex; align-items: center; gap: 6px;
  margin-bottom: 14px; font-family: 'Black Han Sans', sans-serif; flex-shrink: 0;
}
.wdot { width: 4px; height: 4px; border-radius: 50%; background: var(--red); flex-shrink: 0; }
.ilist { display: flex; flex-direction: column; gap: 6px; height: 310px; min-height: 310px; overflow-y: auto; flex-shrink: 0; }
.ii {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 12px; height: 42px;
  background: var(--s2); border: 1px solid var(--b1);
  border-radius: 8px; cursor: pointer; user-select: none;
  transition: border-color 0.12s; flex-shrink: 0;
}
.ii:hover { border-color: var(--b2); }
.ii:hover .xbtn { opacity: 1; }
.ii.done { opacity: 0.35; }
.ii.ghost { opacity: 0; pointer-events: none; }
.iprio { width: 3px; height: 18px; border-radius: 2px; flex-shrink: 0; }
.ph { background: var(--red); }
.pm { background: var(--yel); }
.pl { background: var(--blue); }
.ichk {
  width: 15px; height: 15px; border: 1.5px solid var(--b3);
  border-radius: 4px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.15s;
}
.ii.done .ichk { background: var(--green); border-color: var(--green); }
.ii.done .ichk::after {
  content: ''; width: 7px; height: 4px;
  border-left: 1.5px solid #0d0d0e; border-bottom: 1.5px solid #0d0d0e;
  transform: rotate(-45deg) translateY(-1px);
}
.itext { font-size: 12px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ii.done .itext { text-decoration: line-through; color: var(--tx3); }
.itag {
  font-size: 9px; color: var(--tx3); background: var(--b1);
  border-radius: 4px; padding: 2px 6px; flex-shrink: 0; white-space: nowrap;
}
.idate {
  font-size: 9px; color: var(--tx3);
  flex-shrink: 0; white-space: nowrap;
}
.xbtn {
  font-size: 10px; color: var(--tx3); background: none; border: none;
  cursor: pointer; opacity: 0; transition: opacity 0.12s, color 0.12s;
  font-family: var(--font); padding: 0 2px; flex-shrink: 0;
}
.xbtn:hover { color: var(--red); }
.add-row { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; flex-shrink: 0; }
.ainput {
  flex: 1; background: var(--s2); border: 1px solid var(--b1);
  border-radius: 7px; padding: 8px 11px;
  font-size: 11px; color: var(--tx); font-family: var(--font);
  outline: none; transition: border-color 0.15s; min-width: 0;
}
.ainput:focus { border-color: var(--b3); }
.ainput::placeholder { color: var(--tx3); }
.asel {
  background: var(--s2); border: 1px solid var(--b1);
  border-radius: 7px; padding: 8px;
  font-size: 11px; color: var(--tx2); font-family: var(--font);
  outline: none; cursor: pointer; flex-shrink: 0;
}
.abtn {
  background: var(--s2); border: 1px solid var(--b2);
  border-radius: 7px; padding: 8px 14px;
  font-size: 11px; color: var(--green); font-family: var(--font);
  cursor: pointer; transition: all 0.15s; white-space: nowrap; flex-shrink: 0;
}
.abtn:hover { background: var(--b1); }
.toast {
  position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
  background: var(--b2); color: var(--tx); font-size: 11px;
  padding: 8px 16px; border-radius: 8px; pointer-events: none;
  opacity: 0; transition: opacity 0.2s; white-space: nowrap; z-index: 99;
}
.toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="w">
  <div class="wlabel">
    <span class="wdot"></span>Tasks
  </div>
  <div class="ilist" id="t-list"></div>
  <div class="add-row">
    <input class="ainput" id="t-inp" placeholder="+ 태스크 추가..." onkeydown="if(event.key==='Enter')addT()">
    <select class="asel" id="t-prio">
      <option value="높음">🔥 High</option>
      <option value="중간" selected>🟧 Mid</option>
      <option value="낮음">🟦 Low</option>
    </select>
    <select class="asel" id="t-tag"></select>
    <button class="abtn" onclick="addT()">추가</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const PROXY    = 'https://notion-phi-six.vercel.app/api/notion';
const DB_ID    = 'e7f1b0f0e0c345ec85f2224abe15d617';
const DATE_KEY = 'devflow_tasks_date';
const MIN_SLOTS = 6;

let tasks = [];

function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2000);
}

function toDateStr(d) { return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`; }

function isToday(isoStr) {
  if (!isoStr) return false;
  return toDateStr(new Date(isoStr)) === toDateStr(new Date());
}

function formatDate(isoStr) {
  if (!isoStr) return '';
  const d = new Date(isoStr);
  return `${d.getMonth()+1}/${d.getDate()}`;
}

function prioClass(p) {
  if (p === '높음') return 'ph';
  if (p === '중간') return 'pm';
  return 'pl';
}

function renderT() {
  const el = document.getElementById('t-list');
  el.innerHTML = '';
  const active = tasks.filter(t => !t.done);
  const done   = tasks.filter(t => t.done);
  [...active, ...done].forEach(t => {
    const d = document.createElement('div');
    d.className = 'ii' + (t.done ? ' done' : '');
    const isCarried = !isToday(t.createdAt);
    d.innerHTML = `
      <div class="iprio ${prioClass(t.p)}"></div>
      <div class="ichk"></div>
      <span class="itext">${t.t}</span>
      ${t.tag ? `<span class="itag">${t.tag}</span>` : ''}
      ${isCarried && !t.done ? `<span class="idate">${formatDate(t.createdAt)}</span>` : ''}
      <button class="xbtn" onclick="delT('${t.pageId}', event)">✕</button>
    `;
    d.onclick = e => { if(e.target.classList.contains('xbtn')) return; toggleT(t); };
    el.appendChild(d);
  });
  // 6개 미만이면 투명 더미
  const ghostCount = MIN_SLOTS - tasks.length;
  for (let i = 0; i < ghostCount; i++) {
    const g = document.createElement('div');
    g.className = 'ii ghost';
    g.innerHTML = '<div class="iprio"></div><div class="ichk"></div><span class="itext">·</span>';
    el.appendChild(g);
  }
}

async function loadTagOptions() {
  try {
    const res = await fetch(`${PROXY}?path=databases/${DB_ID}`);
    const data = await res.json();
    const options = data.properties?.Tag?.multi_select?.options || [];
    const sel = document.getElementById('t-tag');
    sel.innerHTML = options.map(o => `<option value="${o.name}">${o.name}</option>`).join('');
    sel.innerHTML += '<option value="">—</option>';
  } catch(e) {}
}

async function loadFromNotion() {
  try {
    // 오늘 생성된 것 (Done 포함) + 이전에 생성된 Todo (이월)
    const todayStart = new Date();
    todayStart.setHours(0, 0, 0, 0);

    const res = await fetch(`${PROXY}?path=databases/${DB_ID}/query`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        filter: {
          or: [
            // 오늘 생성된 건 Done 포함 모두 표시
            { property: 'Created', created_time: { on_or_after: todayStart.toISOString() } },
            // 이전 생성된 Todo만 이월
            { and: [
              { property: 'Status', select: { does_not_equal: 'Done' } },
              { property: 'Created', created_time: { before: todayStart.toISOString() } }
            ]}
          ]
        },
        sorts: [{ timestamp: 'created_time', direction: 'descending' }]
      })
    });
    const data = await res.json();
    tasks = data.results.map(p => ({
      pageId: p.id,
      t: p.properties.Task.title[0]?.plain_text || '',
      p: p.properties.Priority?.select?.name || '중간',
      tag: p.properties.Tag?.multi_select?.[0]?.name || '',
      done: p.properties.Status?.select?.name === 'Done',
      createdAt: p.created_time
    }));
    renderT();
  } catch(e) {
    showToast('로드 실패');
  }
}

async function toggleT(t) {
  t.done = !t.done;
  renderT();
  const now = new Date().toISOString();
  try {
    await fetch(`${PROXY}?path=pages/${t.pageId}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        properties: {
          Status: { select: { name: t.done ? 'Done' : 'Todo' } },
          ...(t.done ? { 'Completed At': { date: { start: now } } } : { 'Completed At': { date: null } })
        }
      })
    });
  } catch(e) { showToast('저장 실패'); }
}

async function addT() {
  const t = document.getElementById('t-inp').value.trim();
  if (!t) return;
  const p   = document.getElementById('t-prio').value;
  const tag = document.getElementById('t-tag').value;
  document.getElementById('t-inp').value = '';
  try {
    const res = await fetch(`${PROXY}?path=pages`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        parent: { database_id: DB_ID },
        properties: {
          Task: { title: [{ text: { content: t } }] },
          Status: { select: { name: 'Todo' } },
          Priority: { select: { name: p } },
          Tag: tag ? { multi_select: [{ name: tag }] } : { multi_select: [] }
        }
      })
    });
    const page = await res.json();
    tasks.unshift({ pageId: page.id, t, p, tag, done: false, createdAt: new Date().toISOString() });
    renderT();
  } catch(e) { showToast('추가 실패'); }
}

async function delT(pageId, e) {
  e.stopPropagation();
  try {
    await fetch(`${PROXY}?path=pages/${pageId}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ archived: true })
    });
    tasks = tasks.filter(t => t.pageId !== pageId);
    renderT();
  } catch(e) { showToast('삭제 실패'); }
}

// 자정 초기화: 오늘 생성 Done → archived, Todo → 이월 유지
async function checkDayReset() {
  const today = toDateStr(new Date());
  const last  = localStorage.getItem(DATE_KEY);
  if (last && last !== today) {
    const doneTasks = tasks.filter(t => t.done);
    for (const t of doneTasks) {
      await fetch(`${PROXY}?path=pages/${t.pageId}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ archived: true })
      });
    }
    await loadFromNotion();
  }
  localStorage.setItem(DATE_KEY, today);
}

async function init() {
  await loadTagOptions();
  await loadFromNotion();
  await checkDayReset();
}

init();

setInterval(async () => {
  const today = toDateStr(new Date());
  if (localStorage.getItem(DATE_KEY) !== today) {
    await checkDayReset();
  }
}, 60000);
</script>
</body>
</html>
