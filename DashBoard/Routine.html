<!DOCTYPE html>

<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Routine</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&family=Black+Han+Sans&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:    #0d0d0e;
  --s1:    #141415;
  --s2:    #1a1a1c;
  --b1:    #232326;
  --b2:    #2e2e32;
  --b3:    #3a3a3f;
  --tx:    #e5e5e9;
  --tx2:   #7c7c88;
  --tx3:   #404048;
  --green: #6effa0;
  --red:   #ff6060;
  --font:  'DM Mono', monospace;
}
html, body {
  background: var(--bg);
  color: var(--tx);
  font-family: var(--font);
  font-size: 13px;
  margin: 0; padding: 0;
  overflow: hidden;
}
::-webkit-scrollbar { width: 3px; }
::-webkit-scrollbar-thumb { background: var(--b2); border-radius: 2px; }
.w {
  background: var(--s1);
  border: 1px solid var(--b2);
  border-radius: 0;
  padding: 20px 22px;
  display: flex;
  flex-direction: column;
}
.wlabel {
  font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--tx3); display: flex; align-items: center; gap: 6px;
  margin-bottom: 14px; font-family: 'Black Han Sans', sans-serif; flex-shrink: 0;
}
.wdot { width: 4px; height: 4px; border-radius: 50%; background: var(--green); flex-shrink: 0; }
.wlabel-r { margin-left: auto; display: flex; gap: 8px; }
.wlbtn {
  font-size: 9px; color: var(--tx3); background: none; border: none;
  font-family: var(--font); cursor: pointer; letter-spacing: 0.08em;
  transition: color 0.15s; padding: 0;
}
.wlbtn:hover { color: var(--tx2); }
.prow { display: flex; justify-content: space-between; margin-bottom: 5px; flex-shrink: 0; }
.plbl { font-size: 10px; color: var(--tx3); }
.pval { font-size: 10px; color: var(--green); }
.ptrack { height: 2px; background: var(--b1); border-radius: 1px; overflow: hidden; margin-bottom: 14px; flex-shrink: 0; }
.pfill { height: 100%; border-radius: 1px; background: var(--green); transition: width 0.4s cubic-bezier(.4,0,.2,1); }
/* 6개 고정: 아이템 42px + gap 6px = 48px * 6 - 6px = 282px */
.ilist { display: flex; flex-direction: column; gap: 6px; min-height: 282px; height: 282px; overflow-y: auto; flex-shrink: 0; }
.ii {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 12px; height: 42px;
  background: var(--s2); border: 1px solid var(--b1);
  border-radius: 8px; cursor: pointer; user-select: none;
  transition: border-color 0.12s; flex-shrink: 0;
}
.ii:hover { border-color: var(--b2); }
.ii:hover .xbtn { opacity: 1; }
.ii.done { opacity: 0.35; }
.ii.ghost { opacity: 0; pointer-events: none; }
.ichk {
  width: 15px; height: 15px; border: 1.5px solid var(--b3);
  border-radius: 4px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.15s;
}
.ii.done .ichk { background: var(--green); border-color: var(--green); }
.ii.done .ichk::after {
  content: ''; width: 7px; height: 4px;
  border-left: 1.5px solid #0d0d0e; border-bottom: 1.5px solid #0d0d0e;
  transform: rotate(-45deg) translateY(-1px);
}
.itext { font-size: 12px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ii.done .itext { text-decoration: line-through; color: var(--tx3); }
.xbtn {
  font-size: 10px; color: var(--tx3); background: none; border: none;
  cursor: pointer; opacity: 0; transition: opacity 0.12s, color 0.12s;
  font-family: var(--font); padding: 0 2px; flex-shrink: 0;
}
.xbtn:hover { color: var(--red); }
.add-row { display: flex; gap: 6px; margin-top: 10px; flex-shrink: 0; }
.ainput {
  flex: 1; background: var(--s2); border: 1px solid var(--b1);
  border-radius: 7px; padding: 8px 11px;
  font-size: 11px; color: var(--tx); font-family: var(--font);
  outline: none; transition: border-color 0.15s;
}
.ainput:focus { border-color: var(--b3); }
.ainput::placeholder { color: var(--tx3); }
.abtn {
  background: var(--s2); border: 1px solid var(--b2);
  border-radius: 7px; padding: 8px 14px;
  font-size: 11px; color: var(--green); font-family: var(--font);
  cursor: pointer; transition: all 0.15s; white-space: nowrap;
}
.abtn:hover { background: var(--b1); }
.toast {
  position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
  background: var(--b2); color: var(--tx); font-size: 11px;
  padding: 8px 16px; border-radius: 8px; pointer-events: none;
  opacity: 0; transition: opacity 0.2s; white-space: nowrap; z-index: 99;
}
.toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="w">
  <div class="wlabel">
    <span class="wdot"></span>Daily Routine
  </div>
  <div class="prow">
    <span class="plbl">달성률</span>
    <span class="pval" id="r-pct">0%</span>
  </div>
  <div class="ptrack"><div class="pfill" id="r-bar" style="width:0%"></div></div>
  <div class="ilist" id="r-list"></div>
  <div class="add-row">
    <input class="ainput" id="r-inp" placeholder="+ 루틴 추가..." onkeydown="if(event.key==='Enter')addR()">
    <button class="abtn" style="background:var(--s2);border-color:var(--b2);color:var(--tx3);" onclick="resetRoutine()">초기화</button>
    <button class="abtn" onclick="addR()">추가</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const DASHBOARD_SECRET = new URLSearchParams(location.search).get('s') || '';
const PROXY  = 'https://notion-phi-six.vercel.app/api/notion';
const DB_ID  = '962fcac506f04e3fbecc03143c27ef15';
const DATE_KEY = 'devflow_routine_date';
const MIN_SLOTS = 6;

let routines = []; // {id, pageId, t, done}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2000);
}

function toDateStr(d) { return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`; }

function rpct() {
  if (!routines.length) return 0;
  return Math.round(routines.filter(r => r.done).length / routines.length * 100);
}

function renderR() {
  const pct = rpct();
  document.getElementById('r-pct').textContent = pct + '%';
  document.getElementById('r-bar').style.width = pct + '%';
  const el = document.getElementById('r-list');
  el.innerHTML = '';
  routines.forEach(r => {
    const d = document.createElement('div');
    d.className = 'ii' + (r.done ? ' done' : '');
    d.innerHTML = `<div class="ichk"></div><span class="itext">${esc(r.t)}</span><button class="xbtn" onclick="delR('${esc(r.pageId)}',event)">✕</button>`;
    d.onclick = e => { if(e.target.classList.contains('xbtn')) return; toggleR(r); };
    el.appendChild(d);
  });
  // 6개 미만이면 투명 더미
  const ghostCount = MIN_SLOTS - routines.length;
  for (let i = 0; i < ghostCount; i++) {
    const g = document.createElement('div');
    g.className = 'ii ghost';
    g.innerHTML = '<div class="ichk"></div><span class="itext">·</span>';
    el.appendChild(g);
  }
}

async function loadFromNotion() {
  try {
    const res = await fetch(`${PROXY}?path=databases/${DB_ID}/query`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-dashboard-secret': DASHBOARD_SECRET },
      body: JSON.stringify({ sorts: [{ property: 'Order', direction: 'ascending' }] })
    });
    if (!res.ok) throw new Error(res.status);
    const data = await res.json();
    routines = data.results.map(p => ({
      pageId: p.id,
      t: p.properties.Routine.title[0]?.plain_text || '',
      done: p.properties.Done.checkbox
    }));
    renderR();
  } catch(e) {
    showToast('로드 실패');
  }
}

async function toggleR(r) {
  r.done = !r.done;
  renderR();
  try {
    await fetch(`${PROXY}?path=pages/${r.pageId}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json', 'x-dashboard-secret': DASHBOARD_SECRET },
      body: JSON.stringify({ properties: { Done: { checkbox: r.done } } })
    });
  } catch(e) {
    showToast('저장 실패');
  }
}

let adding = false;
async function addR() {
  if (adding) return;
  const t = document.getElementById('r-inp').value.trim();
  if (!t) return;
  adding = true;
  try {
    const res = await fetch(`${PROXY}?path=pages`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-dashboard-secret': DASHBOARD_SECRET },
      body: JSON.stringify({
        parent: { database_id: DB_ID },
        properties: {
          Routine: { title: [{ text: { content: t } }] },
          Done: { checkbox: false },
          Order: { number: routines.length + 1 }
        }
      })
    });
    const page = await res.json();
    document.getElementById('r-inp').value = '';
    routines.push({ pageId: page.id, t, done: false });
    renderR();
  } catch(e) {
    showToast('추가 실패');
  } finally {
    adding = false;
  }
}

async function delR(pageId, e) {
  e.stopPropagation();
  try {
    await fetch(`${PROXY}?path=pages/${pageId}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json', 'x-dashboard-secret': DASHBOARD_SECRET },
      body: JSON.stringify({ archived: true })
    });
    routines = routines.filter(r => r.pageId !== pageId);
    renderR();
  } catch(e) {
    showToast('삭제 실패');
  }
}

async function resetRoutine() {
  routines.forEach(r => r.done = false);
  await Promise.all(routines.map(r =>
    fetch(`${PROXY}?path=pages/${r.pageId}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json', 'x-dashboard-secret': DASHBOARD_SECRET },
      body: JSON.stringify({ properties: { Done: { checkbox: false } } })
    })
  ));
  renderR();
  showToast('루틴 초기화됨');
}

async function checkDayReset() {
  const today = toDateStr(new Date());
  const last  = localStorage.getItem(DATE_KEY);
  if (last !== today) {
    localStorage.setItem(DATE_KEY, today);
    await resetRoutine();
  }
}

async function init() {
  await loadFromNotion();
  await checkDayReset();
}

init();

// 자정 체크 (브라우저 열려있을 때)
setInterval(async () => {
  const today = toDateStr(new Date());
  if (localStorage.getItem(DATE_KEY) !== today) {
    localStorage.setItem(DATE_KEY, today);
    await resetRoutine();
  }
}, 60000);
</script>

</body>
</html>
